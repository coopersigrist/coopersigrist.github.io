name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Only probe real web links. Liquid tags, file://, and data: URIs are
          # invalid for lychee and can panic older versions.
          args: >-
            --user-agent 'curl/7.54'
            --scheme http
            --scheme https
            --exclude-all-private
            --exclude-path README.md
            --exclude-path FAQ.md
            --exclude-path INSTALL.md
            --exclude-path _pages/404.md
            --exclude-path _pages/blog.md
            --exclude-path _posts
            --exclude-path _projects
            --exclude-path _site
            --exclude-path node_modules
            --exclude-path vendor
            --max-retries 1
            --timeout 20
            --accept 200,204,206,403,429
            --verbose
            --no-progress
            './**/*.md'
            './**/*.html'
